apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: customers-service
  namespace: default
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: customers-service-gitops
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
