apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customers-service-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/bluezapus/devops-lab-01.git
    targetRevision: main
    path: helm/customers-service
    helm:
      releaseName: customers-service-gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
